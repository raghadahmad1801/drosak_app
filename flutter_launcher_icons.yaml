dev_dependencies:
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_image/ic_launcher_foreground.png"
  image_path_ios: "assets/images/app_image/play_store_512.png"
  adaptive_icon_padding: true
  remove_alpha_ios: true
  adaptive_icon_background: "#18171C"
  adaptive_icon_foreground: "assets/images/app_image/ic_launcher_foreground.png"

  min_sdk_android: 21 # android min sdk min:16, default 21
 
 